<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBC Flight Panel</title>
<link rel="stylesheet" href="/panel.css">
<script src="/panel.js" defer></script>
</head>
<body>
<header>
  <div><h1>SBC Flight Panel</h1><span id="profile"></span></div>
  <nav aria-label="MFD screens">
    <button data-page="main" aria-current="page">Main</button>
    <button data-page="settings">Settings</button>
  </nav>
</header>
<main>
  <section id="boot" hidden><h2 id="boot-stage"></h2><p id="boot-message"></p></section>
  <section id="main">
    <div class="instruments"><div>Gear <strong id="gear">–</strong></div><div>Tuner <strong id="tuner">–</strong></div><div>Layer <strong id="layer">–</strong></div></div>
    <h2>Controller status</h2>
    <div id="buttons" class="status-grid"></div>
  </section>
  <section id="settings" hidden>
    <nav aria-label="Settings pages">
      <button data-page="profiles">Themes &amp; profiles</button>
      <button data-page="controls">Button setup</button>
      <button data-page="macros">Macro editor</button>
      <button data-page="diagnostics">Diagnostics</button>
    </nav>
  </section>
  <section id="profiles" hidden>
    <button class="back" data-page="settings">Settings</button>
    <h2>Themes &amp; profiles</h2>
    <form id="theme-form"><label>Theme <select id="theme-choice"></select></label><button>Apply theme</button></form>
    <form id="profile-form"><label>Active profile <select id="profile-choice"></select></label><button>Load profile</button></form>
    <form id="template-form"><label>Starter profile <select id="template-choice"></select></label><button>Create &amp; load</button></form>
  </section>
  <section id="controls" hidden>
    <button class="back" data-page="settings">Settings</button>
    <h2>Button setup</h2>
    <form id="control-form">
      <label>Button <select id="control-choice"></select></label>
      <label>LED behavior <select id="led-mode"></select></label>
      <label>Macro name or KEY_ code <input id="action" list="macro-names" autocomplete="off"></label>
      <datalist id="macro-names"></datalist>
      <label>Hold to confirm (ms) <input id="hold-ms" type="number" min="0" max="10000" step="1" required></label>
      <small>Use 0 for ordinary press behavior. A positive value enables the hold and outcome animations.</small>
      <button>Save button</button>
    </form>
  </section>
  <section id="macros" hidden>
    <button class="back" data-page="settings">Settings</button>
    <h2>Macro editor</h2>
    <label>Load existing macro <select id="macro-choice"></select></label>
    <form id="macro-form">
      <label>Name <input id="macro-name" maxlength="64" required></label>
      <label>Macro JSON <textarea id="macro-definition" rows="6" spellcheck="false" required></textarea></label>
      <button>Save macro</button>
    </form>
  </section>
  <section id="diagnostics" hidden>
    <button class="back" data-page="settings">Settings</button>
    <h2>Diagnostics</h2>
    <pre id="diagnostic-values"></pre>
    <h3>Pressed buttons</h3><p id="pressed"></p>
  </section>
</main>
<footer id="status" aria-live="polite"></footer>
</body>
</html>
